<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap-dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark sticky-top" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="https://getbootstrap.com/">
                    <img src="./img/duck.png" alt="fake-logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home-Catalogo libri</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Anagrafica utenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Storico prestiti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Help</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <div class="container p-3 my-2">
            <h1>Nuovo libro</h1>
        </div>
        <form action="#" method="#">
            <div class="container p-3">
                <div class="row">
                    <div class="col-6">
                        <div class="mb-3">
                            <label for="exampleFormControlInput1" class="form-label">Nome Autore</label>
                            <input type="name-author" class="form-control" id="exampleFormControlInput1"
                                placeholder="inserisci il nome dell'autore">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="mb-3">
                            <label for="exampleFormControlInput2" class="form-label">Cognome Autore</label>
                            <input type="lastname-author" class="form-control" id="exampleFormControlInput2"
                                placeholder="inserisci il cognome dell'autore">
                        </div>
                    </div>
                </div>

                <div class="row my-4">
                    <div class="col-12">
                        <div class="mb-3">
                            <label for="exampleFormControlInput3" class="form-label">Titolo del libro</label>
                            <input type="title-book" class="form-control" id="exampleFormControlInput3"
                                placeholder="inserisci il titolo del libro">
                            <span class="text-secondary">Titolo versione italiana</span>
                        </div>
                    </div>

                </div>

                <div class="row g-3 align-items-end">
                    <div class="col-12 col-lg-4">
                        <select class="form-select" aria-label="Default select example">
                            <option selected>Seleziona il genere</option>
                            <option value="1">Uomo</option>
                            <option value="2">Donna</option>
                            <option value="3">Preferisco non rispondere</option>
                        </select>
                    </div>
                    <div class="col-12 col-lg-4">
                        <label for="year-publ" class="form-label">Anno di pubblicazione:</label>
                        <input type="year-publ" class="form-control" id="year-publ" name="year-publ" min="1" max="2025"
                            placeholder="Inserisci l'anno">
                    </div>
                    <div class="col-12 col-lg-4">
                        <label for="code-isbn" class="form-label">Inserisci il codice ISBN#:</label>
                        <input type="code-isbn" class="form-control" id="code-isbn" name="code-isbn" pattern="[0-9]{9}"
                            title="code-9-numbers" placeholder="Inserisci codice ISBN#">
                    </div>
                </div>
                <hr>
                <div class="row my-3">
                    <div class="col-12">
                        <label name="notes" class="form-label">Note</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="5"
                            placeholder="inserisci eventuali note sul libro"></textarea>
                    </div>
                </div>

                <div class="row my-3">
                    <div class="col-12">
                        <input type="checkbox" id="digital-availability" name="digital-availability" value="digital-availability">
                        <label for="digital-availability">Disponibile anche in digitale</label>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Aggiungi libro</button>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
