<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap-dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark sticky-top" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="https://getbootstrap.com/">
                    <img src="./img/duck.png" alt="fake-logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home-Catalogo libri</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Anagrafica utenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Storico prestiti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Help</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container my-4">
            <div class="row">

                <!-- colonna contenente la tabella -->

                <div class="col-12">
                    <div class="container d-flex justify-content-between">
                        <span><b>Catalogo libri</b></span>
                        <button class="btn btn-primary" type="submit">Aggiungi libro</button>
                    </div>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th class="d-none d-md-table-cell">Data prestito</th>
                                <th>Stato</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>Lorem, ipsum dolor.</td>
                                <td class="d-none d-md-table-cell">30 febbraio</td>
                                <td><span class="badge text-bg-success">Disponibile</span></td>
                                <td><button type="button" class="btn btn-outline-secondary"><i
                                            class="fa-solid fa-pen-to-square"></i></button>
                                    <button type="button" class="btn btn-outline-secondary"><i
                                            class="fa-solid fa-ban"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>Lorem, ipsum dolor.</td>
                                <td class="d-none d-md-table-cell">30 febbraio</td>
                                <td><span class="badge text-bg-danger">Non disponibile</span></td>
                                <td><button type="button" class="btn btn-outline-secondary"><i
                                            class="fa-solid fa-pen-to-square"></i></button>
                                    <button type="button" class="btn btn-outline-secondary"><i
                                            class="fa-solid fa-ban"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>Lorem, ipsum dolor.</td>
                                <td class="d-none d-md-table-cell">30 febbraio</td>
                                <td><span class="badge text-bg-warning text-white">Non disponibile</span></td>
                                <td><button type="button" class="btn btn-outline-secondary"><i
                                            class="fa-solid fa-pen-to-square"></i></button>
                                    <button type="button" class="btn btn-outline-secondary"><i
                                            class="fa-solid fa-ban"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="col-12"></div>
                <div class="col-12"></div>
            </div>
        </div>


    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
